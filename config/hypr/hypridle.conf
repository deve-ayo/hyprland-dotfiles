# hypridle (ricing de 2026-10-05). Desde 2026-10-06, a pedido, NADA acontece sozinho
# quando o computador fica parado: não escurece, não bloqueia, não apaga a tela e não
# suspende. Ele continua rodando só para:
#   - SUPER+L (loginctl lock-session) abrir o hyprlock sem duplicar;
#   - bloquear a tela antes de o sistema suspender por outro motivo (ex.: tampa fechada
#     na bateria, scripts/lid.sh).
# A versão com ações por inatividade está em
# ~/.config/ricing-backup-2026-10-05/hypridle.conf.com-inatividade
# Serviço: systemctl --user status hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}
