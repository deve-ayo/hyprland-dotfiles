# Cores geradas pelo wallust (define $background, $foreground, $accent, $accent2, $wallpaper)
source = ~/.cache/wallust/hyprlock.conf

background {
    monitor =
    path = $wallpaper
    color = $background
    blur_passes = 3
    blur_size = 8
    brightness = 0.65
}

image {
    monitor =
    path = ~/.config/hypr/assets/lock-avatar.png
    size = 140
    rounding = -1
    border_size = 3
    border_color = $accent
    rotate = 0
    reload_time = -1
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 76
    font_family = Noto Sans Bold
    position = 0, 155
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = $foreground
    font_size = 16
    font_family = Noto Sans
    position = 0, 95
    halign = center
    valign = center
}

general {
    hide_cursor = true
}

input-field {
    monitor =
    size = 280, 56
    rounding = -1
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.32
    dots_center = true
    outer_color = $accent
    inner_color = $background
    font_color = $foreground
    fade_on_empty = true
    placeholder_text = <i>Digite sua senha...</i>
    hide_input = false
    position = 0, -135
    halign = center
    valign = center
}
