# Luz noturna (hyprsunset): tela mais quente das 19:00 às 06:30.
# SUPER+N liga/desliga na hora (scripts/luz-noturna.sh); o horário volta a valer
# na próxima troca. Serviço: systemctl --user status hyprsunset

profile {
    time = 6:30
    identity = true
}

profile {
    time = 19:00
    temperature = 3074
}
